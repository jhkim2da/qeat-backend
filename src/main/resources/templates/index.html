<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>qeat | Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
    }

    header {
      background: white;
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #666;
    }

    .booth-title {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .booth-title h1 {
      margin: 0;
      font-size: 20px;
    }

    .table-badge {
      background: #eef3ff;
      color: #2f5fff;
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: bold;
    }

    section {
      background: white;
      margin-top: 10px;
      padding: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .recommend-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .recommend-item {
      min-width: 180px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .recommend-item img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .recommend-info {
      padding: 10px;
    }

    .recommend-info h4 {
      margin: 0 0 4px 0;
      font-size: 14px;
    }

    .price {
      font-weight: bold;
      font-size: 14px;
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .category {
      padding: 8px 14px;
      border-radius: 20px;
      background: #f0f0f0;
      font-size: 13px;
      white-space: nowrap;
    }

    .category.active {
      background: #222;
      color: white;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .menu-info h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
    }

    .menu-info p {
      margin: 0;
      font-size: 13px;
      color: #666;
    }

    .menu-img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: #ddd;
    }
  </style>
</head>

<body>

<header>
  <div class="top-bar">
    <span>주문내역 0건</span>
    <span>직원호출</span>
  </div>

  <div class="booth-title">
    <h1>메이트치킨</h1>
    <div class="table-badge">테이블 10번</div>
  </div>
</header>

<section>
  <div class="section-title">
    <span>추천 메뉴</span>
    <span style="font-size:13px;color:#888;">더보기</span>
  </div>

  <div class="recommend-list">
    <div class="recommend-item">
      <img src="https://images.unsplash.com/photo-1604908177522-050ff7b4f5a6" />
      <div class="recommend-info">
        <h4>황제 호화스러운 치킨</h4>
        <div class="price">20,500원</div>
      </div>
    </div>

    <div class="recommend-item">
      <img src="https://images.unsplash.com/photo-1601924638867-3ec2f6cfdc6b" />
      <div class="recommend-info">
        <h4>호화스러운 치킨</h4>
        <div class="price">20,500원</div>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="category-tabs">
    <div class="category active">대표메뉴</div>
    <div class="category">치킨</div>
    <div class="category">피자</div>
    <div class="category">사이드</div>
  </div>
</section>

<section>
  <div class="menu-item">
    <div class="menu-info">
      <h3>황제 호화스러운 치킨</h3>
      <p>맛도 가격도 황제!</p>
      <div class="price">20,500원</div>
    </div>
    <div class="menu-img"></div>
  </div>

  <div class="menu-item">
    <div class="menu-info">
      <h3>황제 호화스러운 치킨</h3>
      <p>바삭하고 풍부한 맛</p>
      <div class="price">20,500원</div>
    </div>
    <div class="menu-img"></div>
  </div>
</section>

</body>
</html>
